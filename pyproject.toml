[project]
name = "agent-smith"
version = "0.1.0"
description = "Agent Smith: Autonomous reasoning, code generation, and execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "mcp>=1.22.0,<2.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "colorama>=0.4.6",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sandbox = "sandbox:cli_main"
agent_mbpp = "agent_mbpp:main"
agent_swebench = "agent_swebench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = ["moulinette", "evaluations", ".venv", "student"]
python_files = ["test_*.py"]

